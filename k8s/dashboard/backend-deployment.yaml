apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-backend
  template:
    metadata:
      labels:
        app: dashboard-backend
    spec:
      containers:
        - name: backend
          image: dashboard-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: WAZUH_CONTAINER
              value: "wazuh-manager"
            - name: WAZUH_ARCHIVES_PATH
              value: "/var/ossec/logs/archives/archives.log"
            - name: MAX_LINES
              value: "5000"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
