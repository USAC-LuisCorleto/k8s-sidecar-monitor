apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-frontend
  template:
    metadata:
      labels:
        app: dashboard-frontend
    spec:
      containers:
        - name: frontend
          image: dashboard-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
