apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-external-access
  namespace: default
spec:
  selector:
    matchLabels:
      app: service-b
  action: DENY
  rules:
    - from:
        - source:
            notNamespaces: ["default"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/internal/process"]
