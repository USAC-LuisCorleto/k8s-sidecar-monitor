# Wazuh Manager Standalone - Docker Compose
# Version simplificada para laboratorio academico
# Recibe logs via syslog (UDP 514) de Fluent Bit

services:
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: wazuh-manager
    hostname: wazuh-manager
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - WAZUH_REGISTRATION_PASSWORD=admin
    volumes:
      - wazuh-logs:/var/ossec/logs
      - wazuh-etc:/var/ossec/etc
      - wazuh-queue:/var/ossec/queue
    networks:
      - wazuh-net

volumes:
  wazuh-logs:
  wazuh-etc:
  wazuh-queue:

networks:
  wazuh-net:
    driver: bridge
